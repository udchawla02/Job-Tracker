<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Application Tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.9.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f5f5f3;
      --bg-tertiary: #f0efe8;
      --text: #1a1a1a;
      --text-secondary: #6b6b6b;
      --border: rgba(0,0,0,0.12);
      --border-md: rgba(0,0,0,0.22);
      --radius-md: 8px;
      --radius-lg: 12px;
      --font: -apple-system, 'Segoe UI', sans-serif;
      --accent: #185FA5;
      --accent-bg: #E6F1FB;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-secondary: #2c2c2e;
        --bg-tertiary: #3a3a3c;
        --text: #f2f2f2;
        --text-secondary: #a1a1a1;
        --border: rgba(255,255,255,0.1);
        --border-md: rgba(255,255,255,0.2);
        --accent: #378ADD;
        --accent-bg: #0C447C;
      }
    }

    body {
      font-family: var(--font);
      background: var(--bg-tertiary);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    header p {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 1.5rem;
      align-items: center;
    }

    .url-input {
      flex: 1;
      padding: 0 14px;
      height: 42px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
    }

    .url-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(100,130,200,0.1);
    }

    .url-input::placeholder { color: var(--text-secondary); }

    .btn-primary {
      height: 42px;
      padding: 0 18px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      font-family: var(--font);
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .btn-primary:hover { background: var(--bg-secondary); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .loading-bar {
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      margin-bottom: 1rem;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid var(--border-md);
      border-top-color: var(--text-secondary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 500px) {
      .stats-row { grid-template-columns: repeat(2, 1fr); }
    }

    .stat-card {
      background: var(--bg);
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border);
      padding: 12px 14px;
    }

    .stat-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
    .stat-val { font-size: 24px; font-weight: 500; color: var(--text); }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }

    .filter-pill {
      padding: 5px 14px;
      border-radius: 999px;
      border: 0.5px solid var(--border);
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      background: transparent;
      font-family: var(--font);
      transition: all 0.15s;
    }

    .filter-pill.active {
      border-color: var(--border-md);
      color: var(--text);
      background: var(--bg-secondary);
      font-weight: 500;
    }

    .app-list { display: flex; flex-direction: column; gap: 10px; }

    .app-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
      transition: border-color 0.15s;
    }

    .app-card:hover { border-color: var(--border-md); }

    .app-role { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 2px; }
    .app-company { font-size: 13px; color: var(--text-secondary); }

    .app-meta {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 999px;
      font-weight: 500;
    }

    .badge-applied    { background: #E6F1FB; color: #0C447C; }
    .badge-phone      { background: #FAEEDA; color: #633806; }
    .badge-interview  { background: #EEEDFE; color: #3C3489; }
    .badge-offer      { background: #EAF3DE; color: #27500A; }
    .badge-rejected   { background: #FCEBEB; color: #791F1F; }
    .badge-withdrawn  { background: #F1EFE8; color: #444441; }

    .app-date { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
    .app-link { font-size: 12px; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 3px; }
    .app-link:hover { text-decoration: underline; }

    .app-desc {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .app-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .select-status {
      font-size: 12px;
      padding: 5px 8px;
      border: 0.5px solid var(--border-md);
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      color: var(--text);
      cursor: pointer;
      font-family: var(--font);
    }

    .btn-del {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-secondary);
      padding: 5px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      font-size: 16px;
      transition: all 0.15s;
    }

    .btn-del:hover { color: #A32D2D; background: #FCEBEB; }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
    }

    .empty-state i { font-size: 40px; display: block; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 14px; }

    .api-key-banner {
      background: #FAEEDA;
      color: #633806;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .api-key-section {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
    }

    .api-key-section label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 6px; }

    .api-key-row { display: flex; gap: 8px; }

    .api-key-input {
      flex: 1;
      padding: 0 12px;
      height: 38px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
    }

    .api-key-input:focus { outline: none; border-color: var(--accent); }

    .btn-save-key {
      height: 38px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 0.5px solid var(--border-md);
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 13px;
      font-family: var(--font);
      cursor: pointer;
    }

    .btn-save-key:hover { background: var(--bg-tertiary); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="ti ti-briefcase" style="font-size:20px;vertical-align:-2px;margin-right:6px"></i>Job Application Tracker</h1>
      <p>Paste a job URL to auto-fill details and track your pipeline</p>
    </header>

    <div class="api-key-section" id="apiKeySection">
      <label><i class="ti ti-key" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>Anthropic API Key — required for autofill (stored locally, never sent anywhere else)</label>
      <div class="api-key-row">
        <input class="api-key-input" id="apiKeyInput" type="password" placeholder="sk-ant-…" />
        <button class="btn-save-key" onclick="saveKey()">Save Key</button>
      </div>
      <p style="font-size:12px;color:var(--text-secondary);margin-top:6px">Get a free key at <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a> · Stored in your browser only</p>
    </div>

    <div class="top-bar">
      <input class="url-input" id="urlInput" type="url" placeholder="Paste job posting URL here…" />
      <button class="btn-primary" id="addBtn" onclick="handleAdd()">
        <i class="ti ti-sparkles"></i> Autofill & Add
      </button>
    </div>

    <div class="loading-bar" id="loadingBar">
      <div class="spinner"></div>
      <span id="loadingText">Reading job posting…</span>
    </div>

    <div class="stats-row" id="statsRow"></div>
    <div class="filters" id="filterRow"></div>
    <div class="app-list" id="appList"></div>
  </div>

  <script>
    const STATUSES = ['Applied','Phone Screen','Technical Interview','Final Round','Offer','Rejected','Withdrawn'];
    const BADGE_CLASS = {
      'Applied':'badge-applied','Phone Screen':'badge-phone',
      'Technical Interview':'badge-interview','Final Round':'badge-interview',
      'Offer':'badge-offer','Rejected':'badge-rejected','Withdrawn':'badge-withdrawn'
    };

    let apps = JSON.parse(localStorage.getItem('job_tracker_apps') || '[]');
    let activeFilter = 'All';
    let apiKey = localStorage.getItem('job_tracker_apikey') || '';

    function saveKey() {
      apiKey = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('job_tracker_apikey', apiKey);
      document.getElementById('apiKeySection').style.borderColor = '#1D9E75';
      setTimeout(() => document.getElementById('apiKeySection').style.borderColor = '', 1500);
    }

    function saveApps() {
      localStorage.setItem('job_tracker_apps', JSON.stringify(apps));
    }

    function extractDomain(url) {
      try { return new URL(url).hostname.replace('www.','').split('.')[0]; } catch(e) { return 'Unknown'; }
    }

    async function handleAdd() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('Please paste a job URL first.'); return; }
      if (!apiKey) { alert('Please enter your Anthropic API key first.'); return; }

      const btn = document.getElementById('addBtn');
      const bar = document.getElementById('loadingBar');
      btn.disabled = true;
      bar.style.display = 'flex';
      document.getElementById('loadingText').textContent = 'Reading job posting…';

      try {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-api-key": apiKey,
            "anthropic-version": "2023-06-01",
            "anthropic-dangerous-direct-browser-access": "true"
          },
          body: JSON.stringify({
            model: "claude-sonnet-4-5",
            max_tokens: 1000,
            tools: [{ type: "web_search_20250305", name: "web_search" }],
            system: `You are a job posting parser. The user gives you a job URL. First use web_search to fetch the page content. Then return ONLY a valid JSON object — no markdown fences, no explanation, just raw JSON:
{"role":"exact job title","company":"company name","location":"city, country or Remote","description":"2 clear sentences summarizing the role and key requirements"}
If any field is missing, infer from context. Always return valid JSON.`,
            messages: [{ role: "user", content: `Fetch and extract job details from this URL: ${url}` }]
          })
        });

        document.getElementById('loadingText').textContent = 'Extracting details…';
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
        const fullText = (data.content || []).map(b => b.type === 'text' ? b.text : '').join('');
        let parsed = {};
        try {
          // Try to find JSON anywhere in the response
          const m = fullText.match(/\{[^{}]*"role"[^{}]*\}/s) || fullText.match(/\{[\s\S]*?\}/);
          if (m) parsed = JSON.parse(m[0]);
        } catch(e) {
          // fallback: try parsing entire response
          try { parsed = JSON.parse(fullText.trim()); } catch(e2) {}
        }

        const app = {
          id: Date.now(),
          role: parsed.role || 'Unknown Role',
          company: parsed.company || extractDomain(url),
          location: parsed.location || '',
          description: parsed.description || '',
          status: 'Applied',
          url,
          date: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
        };
        apps.unshift(app);
        saveApps();
        document.getElementById('urlInput').value = '';
        activeFilter = 'All';
        render();
      } catch(e) {
        console.error('Autofill error:', e);
        const app = {
          id: Date.now(), role: 'Unknown Role', company: extractDomain(url),
          location: '', description: '', status: 'Applied', url,
          date: new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' })
        };
        apps.unshift(app);
        saveApps();
        render();
        alert('Autofill failed: ' + (e.message || 'Check your API key and try again.'));
      } finally {
        btn.disabled = false;
        bar.style.display = 'none';
      }
    }

    function updateStatus(id, status) {
      const app = apps.find(a => a.id === id);
      if (app) { app.status = status; saveApps(); render(); }
    }

    function deleteApp(id) {
      if (!confirm('Remove this application?')) return;
      apps = apps.filter(a => a.id !== id);
      saveApps();
      render();
    }

    function setFilter(f) { activeFilter = f; render(); }

    function render() {
      if (apiKey) {
        document.getElementById('apiKeyInput').value = apiKey;
        document.getElementById('apiKeySection').style.borderColor = '#1D9E75';
      }

      const filtered = activeFilter === 'All' ? apps : apps.filter(a => a.status === activeFilter);

      const counts = {
        Total: apps.length,
        Active: apps.filter(a => !['Rejected','Withdrawn','Offer'].includes(a.status)).length,
        Offers: apps.filter(a => a.status === 'Offer').length,
        Rejected: apps.filter(a => a.status === 'Rejected').length
      };

      document.getElementById('statsRow').innerHTML = Object.entries(counts).map(([k,v]) =>
        `<div class="stat-card"><div class="stat-label">${k}</div><div class="stat-val">${v}</div></div>`
      ).join('');

      const allFilters = ['All', ...STATUSES.filter(s => apps.some(a => a.status === s))];
      document.getElementById('filterRow').innerHTML = allFilters.map(f =>
        `<button class="filter-pill${activeFilter===f?' active':''}" onclick="setFilter('${f}')">${f}${f!=='All'?' ('+apps.filter(a=>a.status===f).length+')':''}</button>`
      ).join('');

      const list = document.getElementById('appList');
      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">
          <i class="ti ti-briefcase"></i>
          <h3>No applications yet</h3>
          <p>Paste a job URL above and hit Autofill & Add to get started</p>
        </div>`;
        return;
      }

      list.innerHTML = filtered.map(app => `
        <div class="app-card">
          <div>
            <div class="app-role">${app.role}</div>
            <div class="app-company">
              <i class="ti ti-building" style="font-size:13px;vertical-align:-1px;margin-right:4px"></i>
              ${app.company}${app.location ? ' · ' + app.location : ''}
            </div>
            ${app.description ? `<div class="app-desc">${app.description}</div>` : ''}
            <div class="app-meta">
              <span class="badge ${BADGE_CLASS[app.status]||'badge-applied'}">${app.status}</span>
              <span class="app-date"><i class="ti ti-calendar" style="font-size:12px"></i> ${app.date}</span>
              <a class="app-link" href="${app.url}" target="_blank"><i class="ti ti-external-link" style="font-size:12px"></i> View posting</a>
            </div>
          </div>
          <div class="app-actions">
            <select class="select-status" onchange="updateStatus(${app.id}, this.value)">
              ${STATUSES.map(s => `<option value="${s}"${s===app.status?' selected':''}>${s}</option>`).join('')}
            </select>
            <button class="btn-del" onclick="deleteApp(${app.id})" title="Delete">
              <i class="ti ti-trash"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    render();
  </script>
</body>
</html>
